image: mcr.microsoft.com/dotnet/sdk:latest

stages:
  - pre-build
  - build

variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: '*/*/'
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull

build-linux:
  stage: build
  script:
    - 'dotnet restore SilverAudioPlayer.sln --force --packages $NUGET_PACKAGES_DIRECTORY'
    # Build & Publish Catenoid App
    - 'dotnet publish Catenoid/Catenoid.csproj -c Release -p:ExtraDefineConstants="BuildForlinux" --no-restore'
    
    # Pack Libraries (Generates .nupkg and .snupkg)
    - 'dotnet pack SilverCraft.Ekorensis/SilverCraft.Ekorensis.csproj -c Release -o ./nuget-packages -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --no-restore'
    - 'dotnet pack SilverAudioPlayer.Shared/SilverAudioPlayer.Shared.csproj -c Release -o ./nuget-packages -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --no-restore'

  after_script:
    - 'mv Catenoid/bin/Release/net10.0/publish ./catenoid-publish'

  artifacts:
    expire_in: 1 week
    paths:
      - catenoid-publish
      - nuget-packages/*.nupkg
      - nuget-packages/*.snupkg

  tags:
    - saas-linux-small-amd64