image: mcr.microsoft.com/dotnet/sdk:latest
stages:
  - pre-build
  - build


variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: '*/*/'
  GIT_SUBMODULE_STRATEGY: recursive
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull

build-linux:
  stage: build
  script:
    - 'dotnet restore SilverAudioPlayer.sln --force --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet publish Catenoid/Catenoid.csproj -c Release -p:ExtraDefineConstants="BuildForlinux" --no-restore'
  after_script:
    - 'mv Catenoid/bin/Release/net8.0/publish ./catenoid-publish'
  artifacts:
    expire_in: 1 week 
    paths:
      - catenoid-publish
  tags:
    - saas-linux-small-amd64

build-windows:
  stage: build
  script:
    - 'choco install dotnet-8.0-sdk -y'
    - 'dotnet publish Catenoid/Catenoid.csproj -c Release -p:ExtraDefineConstants="BuildForwindows"'
  after_script:
    - 'mv Catenoid\bin\Release\net8.0*\publish ./catenoid-publish'
  artifacts:
    expire_in: 1 week 
    paths:
      - catenoid-publish
  tags:
    - saas-windows-medium-amd64